<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vitalis brand files</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: Figtree, system-ui, sans-serif; background: #eef1f5; color: #172033; }
  main { max-width: 1000px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; margin: 0 0 24px; }
  .row { border-radius: 24px; padding: 28px; display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
  .light { background: #fff; } .dark { background: #0e1424; color: #e7ebf3; }
  figure { margin: 0; text-align: center; font-size: 12px; color: #74809a; }
  figure img { display: block; margin: 0 auto 6px; }
  .mono { color: #172033; } .dark .mono { color: #e7ebf3; }
</style>
</head>
<body>
<main>
  <h1>Vitalis: final mark (B. Signal V)</h1>
  <div class="row light">
    <figure><img src="logo-icon.svg" width="16" height="16" alt="">16</figure>
    <figure><img src="logo-icon.svg" width="32" height="32" alt="">32</figure>
    <figure><img src="logo-icon.svg" width="128" height="128" alt="">128</figure>
    <figure><img src="logo-icon.svg" width="256" height="256" alt="">512 (shown at 256)</figure>
    <figure><img src="logo.svg" width="372" alt="">logo.svg</figure>
  </div>
  <div class="row dark">
    <figure><img src="logo-dark.svg" width="16" height="16" alt="">16</figure>
    <figure><img src="logo-dark.svg" width="32" height="32" alt="">32</figure>
    <figure><img src="logo-dark.svg" width="128" height="128" alt="">128</figure>
    <figure><img src="logo-dark.svg" width="256" height="256" alt="">logo-dark.svg</figure>
  </div>
  <div class="row light">
    <figure><img src="favicon-32.png" width="32" height="32" alt="">favicon-32.png</figure>
    <figure><img src="apple-touch-icon.png" width="90" height="90" alt="" style="border-radius:20px">apple-touch-icon.png</figure>
    <figure><img src="icon-192.png" width="96" height="96" alt="">icon-192.png</figure>
    <figure><img src="icon-512.png" width="128" height="128" alt="">icon-512.png</figure>
    <figure class="mono"><img src="logo-mono.svg" width="64" height="64" alt="">logo-mono.svg</figure>
  </div>
  <p>Earlier directions: <a href="logo-v1-preview.html">logo-v1-preview.html</a></p>
</main>
</body>
</html>
