<!-- Vitalis lockup: mark + wordmark. Wordmark is Bricolage Grotesque Bold, set as text with a
     system fallback (no outline converter available); use the mark alone where fonts can't load. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360" role="img" aria-label="Vitalis">
  <g transform="translate(24 24) scale(0.609375)">
    <rect width="512" height="512" rx="120" fill="#4C5BD4"/>
    <path d="M140 164L256 372L352 200" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="378" cy="150" r="34" fill="#D6336C"/>
  </g>
  <text x="380" y="246" font-family="'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif" font-weight="700" font-size="200" letter-spacing="-7" fill="#172033">vitalis</text>
</svg>
